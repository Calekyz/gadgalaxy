<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetGalaxy | Phones & Computers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(11, 17, 32, 0.65), rgba(26, 26, 46, 0.7)), 
                        url('https://images.unsplash.com/photo-1607853202273-797f1c22a38e?w=1600');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 50px; }
        .logo { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #00d4ff, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tagline { color: #cbd5e1; font-size: 18px; }
        .product-payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .product-card {
            background: linear-gradient(145deg, rgba(30,41,59,0.95), rgba(15,23,42,0.95));
            border-radius: 32px;
            padding: 30px;
            border: 1px solid rgba(59,130,246,0.3);
        }
        .product-selector { margin-bottom: 30px; }
        .product-selector select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border-radius: 16px;
            background: #1e293b;
            color: white;
            border: 1px solid #3b82f6;
            cursor: pointer;
        }
        .product-title { font-size: 28px; font-weight: 800; color: white; margin: 20px 0 10px; }
        .price { font-size: 48px; font-weight: 800; color: #00d4ff; margin: 20px 0; }
        .specs { border-top: 1px solid #334155; padding-top: 20px; margin-top: 20px; }
        .spec-item { display: flex; justify-content: space-between; padding: 10px 0; color: #cbd5e1; border-bottom: 1px solid #1e293b; }
        .payment-card {
            background: white;
            border-radius: 32px;
            padding: 32px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .amount-box { background: #f8fafc; padding: 16px; border-radius: 16px; margin: 20px 0; display: flex; justify-content: space-between; font-weight: bold; }
        .section-header { font-size: 18px; font-weight: 700; margin: 20px 0 15px; padding-bottom: 8px; border-bottom: 2px solid #3b82f6; display: inline-block; }
        .payment-options { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .pay-option-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .pay-option-btn[data-method="card"] { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; }
        .pay-option-btn[data-method="airtm"] { background: linear-gradient(135deg, #00b4d8, #0077b6); color: white; }
        .pay-option-btn[data-method="crypto"] { background: linear-gradient(135deg, #f7931a, #ffb347); color: white; }
        .pay-option-btn.active { transform: scale(1.02); border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .payment-form-panel { display: none; margin-top: 20px; }
        .payment-form-panel.active-panel { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 16px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #0f172a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1e293b; transform: scale(1.02); }
        .crypto-address {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            margin: 16px 0;
            word-break: break-all;
        }
        .copy-btn { background: #3b82f6; margin-top: 8px; padding: 8px; font-size: 14px; }
        .message { margin-top: 16px; padding: 12px; border-radius: 12px; display: none; }
        .message.success { background: #dcfce7; color: #166534; display: block; }
        .message.error { background: #fee2e2; color: #991b1b; display: block; }
        .message.info { background: #dbeafe; color: #1e40af; display: block; }
        @media (max-width: 900px) { .product-payment-grid { grid-template-columns: 1fr; } .form-row { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🛒 GadgetGalaxy</div>
        <div class="tagline">Premium Phones & Computers • Worldwide Shipping</div>
    </div>

    <div class="product-payment-grid">
        <!-- LEFT: PRODUCT DISPLAY -->
        <div class="product-card">
            <div class="product-selector">
                <select id="productSelect">
                    <option value="ps5">🎮 PlayStation 5 - $550</option>
                    <option value="iphone15">📱 iPhone 15 Pro - $999</option>
                    <option value="iphone14">📱 iPhone 14 - $699</option>
                    <option value="macbook">💻 MacBook Pro M3 - $1599</option>
                    <option value="macbookair">💻 MacBook Air M2 - $1099</option>
                    <option value="samsung">📱 Samsung Galaxy S24 - $849</option>
                    <option value="dell">💻 Dell XPS 15 - $1399</option>
                </select>
            </div>
            <div id="productDetails">
                <h1 class="product-title" id="productName">PlayStation 5</h1>
                <div class="price" id="productPrice">$550</div>
                <p id="productDesc" style="color:#94a3b8">Ultra-high speed SSD • 4K gaming</p>
                <div class="specs" id="productSpecs"></div>
            </div>
        </div>

        <!-- RIGHT: PAYMENT + SHIPPING -->
        <div class="payment-card">
            <h2>Complete Purchase</h2>
            <div class="amount-box">
                <span>Total Amount</span>
                <span class="amount-value" id="displayAmount">$550.00</span>
            </div>

            <div class="section-header">📦 Shipping Information</div>
            <div class="form-row">
                <div class="form-group"><label>First Name *</label><input type="text" id="firstName"></div>
                <div class="form-group"><label>Last Name *</label><input type="text" id="lastName"></div>
            </div>
            <div class="form-group"><label>Street Address *</label><input type="text" id="address"></div>
            <div class="form-row">
                <div class="form-group"><label>City *</label><input type="text" id="city"></div>
                <div class="form-group"><label>State *</label><input type="text" id="state"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>ZIP *</label><input type="text" id="zip"></div>
                <div class="form-group"><label>Country *</label><select id="country"><option value="">Select</option><option>US</option><option>CA</option><option>UK</option><option>KE</option></select></div>
            </div>
            <div class="form-group"><label>Phone *</label><input type="tel" id="phone"></div>

            <div class="section-header">💳 Payment Method</div>
            <div class="payment-options">
                <button class="pay-option-btn active" data-method="card">💳 Card Payment</button>
                <button class="pay-option-btn" data-method="airtm">💰 Airtm</button>
                <button class="pay-option-btn" data-method="crypto">₿ Crypto (USDT)</button>
            </div>

            <!-- CARD PANEL (with billing details) -->
            <div id="cardPanel" class="payment-form-panel active-panel">
                <div class="section-header" style="font-size: 14px;">💳 Billing Details</div>
                <div class="form-row">
                    <div class="form-group"><label>Card Number *</label><input type="text" id="cardNumber" placeholder="1234 5678 9012 3456"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Expiry Date *</label><input type="text" id="expiry" placeholder="MM/YY"></div>
                    <div class="form-group"><label>CVV *</label><input type="text" id="cvv" placeholder="123"></div>
                </div>
                <div class="form-group"><label>Cardholder Name *</label><input type="text" id="cardholderName" placeholder="John Doe"></div>
                <div class="form-group"><label>Billing Email *</label><input type="email" id="cardEmail" placeholder="customer@example.com"></div>
                <button id="cardSubmit">Pay with Card</button>
                <div id="cardMessage" class="message"></div>
            </div>

            <!-- AIRTM PANEL -->
            <div id="airtmPanel" class="payment-form-panel">
                <div class="form-group"><label>Email *</label><input type="email" id="airtmEmail"></div>
                <button id="airtmSubmit">Request Payment via Airtm</button>
                <div id="airtmMessage" class="message"></div>
            </div>

            <!-- CRYPTO PANEL -->
            <div id="cryptoPanel" class="payment-form-panel">
                <div class="form-group"><label>Email *</label><input type="email" id="cryptoEmail"></div>
                <button id="cryptoSubmit">Pay via Crypto (USDT)</button>
                <div id="cryptoDetails" style="display:none;">
                    <div class="crypto-address">
                        <strong>USDT (TRC20) Address:</strong><br>
                        <code id="usdtAddress">TVvYRDdPyQCCg22onuaau56rS5PNP3Gx7s</code>
                        <button class="copy-btn" onclick="copyToClipboard('usdtAddress')">📋 Copy</button>
                    </div>
                </div>
                <div id="cryptoMessage" class="message"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // BACKEND URL (YOUR RENDER LINK)
    const BACKEND_URL = 'https://gadgetgalaxy-api-r9ta.onrender.com';

    // PRODUCT DATABASE
    const products = {
        ps5: { name: "PlayStation 5", price: 550, desc: "Ultra-high speed SSD • 4K gaming • Ray tracing", specs: ["825GB SSD", "4K UHD (8K support)", "DualSense Wireless", "1 Year Warranty"] },
        iphone15: { name: "iPhone 15 Pro", price: 999, desc: "A17 Pro chip • Titanium design • 48MP camera", specs: ["256GB Storage", "6.1\" Super Retina", "USB-C", "Action Button"] },
        iphone14: { name: "iPhone 14", price: 699, desc: "A15 Bionic • Dual-camera • Crash Detection", specs: ["128GB Storage", "6.1\" OLED", "5G Ready", "Emergency SOS"] },
        macbook: { name: "MacBook Pro M3", price: 1599, desc: "M3 chip • 14-core GPU • 18hr battery", specs: ["16GB RAM", "512GB SSD", "14.2\" Liquid Retina", "3 Thunderbolt ports"] },
        macbookair: { name: "MacBook Air M2", price: 1099, desc: "M2 chip • Fanless design • All-day battery", specs: ["8GB RAM", "256GB SSD", "13.6\" Display", "MagSafe charging"] },
        samsung: { name: "Samsung Galaxy S24", price: 849, desc: "AI-powered • 50MP camera • Snapdragon 8 Gen 3", specs: ["8GB RAM", "128GB Storage", "120Hz Display", "7 years updates"] },
        dell: { name: "Dell XPS 15", price: 1399, desc: "Intel i7 • RTX 4050 • 3.5K OLED", specs: ["16GB RAM", "512GB SSD", "15.6\" OLED", "Windows 11 Pro"] }
    };

    function updateProduct() {
        const key = document.getElementById('productSelect').value;
        const p = products[key];
        document.getElementById('productName').innerText = p.name;
        document.getElementById('productPrice').innerHTML = `$${p.price}`;
        document.getElementById('productDesc').innerText = p.desc;
        
        let specsHtml = '';
        p.specs.forEach(spec => {
            specsHtml += `<div class="spec-item"><span>${spec}</span></div>`;
        });
        document.getElementById('productSpecs').innerHTML = specsHtml;
        document.getElementById('displayAmount').innerHTML = `$${p.price}.00`;
    }

    document.getElementById('productSelect').addEventListener('change', updateProduct);
    updateProduct();

    function getTotal() {
        const key = document.getElementById('productSelect').value;
        return products[key].price;
    }

    function validateShipping() {
        const fields = ['firstName', 'lastName', 'address', 'city', 'state', 'zip', 'country', 'phone'];
        return fields.every(f => document.getElementById(f).value.trim() !== '');
    }

    function getShippingData() {
        return {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            zip: document.getElementById('zip').value,
            country: document.getElementById('country').value,
            phone: document.getElementById('phone').value
        };
    }

    // Payment method switching
    const btns = document.querySelectorAll('.pay-option-btn');
    const panels = { 
        card: document.getElementById('cardPanel'), 
        airtm: document.getElementById('airtmPanel'), 
        crypto: document.getElementById('cryptoPanel') 
    };
    
    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Object.values(panels).forEach(p => p.classList.remove('active-panel'));
            panels[btn.dataset.method].classList.add('active-panel');
        });
    });

    window.copyToClipboard = (id) => {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        alert('Address copied!');
    };

    function showMessage(elementId, text, type) {
        const el = document.getElementById(elementId);
        el.innerText = text;
        el.className = `message ${type}`;
        setTimeout(() => { el.className = 'message'; }, 5000);
    }

    // CARD SUBMIT
    document.getElementById('cardSubmit').onclick = async () => {
        if (!validateShipping()) {
            showMessage('cardMessage', 'Fill all shipping fields', 'error');
            return;
        }
        
        const cardNum = document.getElementById('cardNumber').value;
        const expiry = document.getElementById('expiry').value;
        const cvv = document.getElementById('cvv').value;
        const cardName = document.getElementById('cardholderName').value;
        const email = document.getElementById('cardEmail').value;
        
        if (!cardNum || !expiry || !cvv || !cardName || !email) {
            showMessage('cardMessage', 'Fill all card details', 'error');
            return;
        }
        
        showMessage('cardMessage', 'Processing payment...', 'info');
        
        const order = {
            product: products[document.getElementById('productSelect').value].name,
            amount: getTotal(),
            paymentMethod: 'card',
            customerEmail: email,
            shipping: getShippingData(),
            billing: {
                cardLast4: cardNum.slice(-4),
                cardholderName: cardName,
                expiry: expiry
            }
        };
        
        try {
            const res = await fetch(`${BACKEND_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(order)
            });
            const data = await res.json();
            showMessage('cardMessage', `Payment successful! Order #${data.orderId}. Confirmation sent to ${email}`, 'success');
        } catch(err) {
            console.log('Order saved locally:', order);
            showMessage('cardMessage', 'Test mode: Card charged $' + getTotal() + '. Order saved.', 'success');
        }
    };

    // AIRTM SUBMIT
    document.getElementById('airtmSubmit').onclick = async () => {
        if (!validateShipping()) {
            showMessage('airtmMessage', 'Fill all shipping fields', 'error');
            return;
        }
        const email = document.getElementById('airtmEmail').value;
        if (!email) { showMessage('airtmMessage', 'Enter email', 'error'); return; }
        
        showMessage('airtmMessage', 'Processing...', 'info');
        const order = {
            product: products[document.getElementById('productSelect').value].name,
            amount: getTotal(),
            paymentMethod: 'airtm',
            customerEmail: email,
            shipping: getShippingData()
        };
        
        try {
            const res = await fetch(`${BACKEND_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(order)
            });
            const data = await res.json();
            showMessage('airtmMessage', `Order #${data.orderId} created! Check ${email} for payment request.`, 'success');
        } catch(err) {
            console.log('Order saved locally:', order);
            showMessage('airtmMessage', 'Backend not connected. Order saved locally.', 'success');
        }
    };

    // CRYPTO SUBMIT
    document.getElementById('cryptoSubmit').onclick = async () => {
        if (!validateShipping()) {
            showMessage('cryptoMessage', 'Fill all shipping fields', 'error');
            return;
        }
        const email = document.getElementById('cryptoEmail').value;
        if (!email) { showMessage('cryptoMessage', 'Enter email', 'error'); return; }
        
        showMessage('cryptoMessage', 'Processing...', 'info');
        const order = {
            product: products[document.getElementById('productSelect').value].name,
            amount: getTotal(),
            paymentMethod: 'crypto',
            customerEmail: email,
            shipping: getShippingData()
        };
        
        try {
            const res = await fetch(`${BACKEND_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(order)
            });
            const data = await res.json();
            document.getElementById('cryptoDetails').style.display = 'block';
            showMessage('cryptoMessage', `Order #${data.orderId} created! Send $${getTotal()} USDT to address below.`, 'success');
        } catch(err) {
            console.log('Order saved locally:', order);
            document.getElementById('cryptoDetails').style.display = 'block';
            showMessage('cryptoMessage', 'Backend not connected. Save this address.', 'success');
        }
    };
</script>
</body>
</html>
